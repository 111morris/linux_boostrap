# config/python.conf — Python developer-runtime configuration.
#
# The Python component ensures Python 3 + pip + venv are available without
# replacing the system interpreter. It never touches /usr/bin/python3.
#
# Precedence: built-in defaults < this file < environment < command line.

# Set to false to skip the Python component entirely.
INSTALL_PYTHON_TOOLS=true

# Optional: pin a specific Python version (resolved through a user-space
# version manager when needed). Empty = use the system default.
PYTHON_VERSION=""
