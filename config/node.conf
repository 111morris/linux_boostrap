# config/node.conf — Node.js developer-runtime configuration.
#
# The Node component ensures Node.js + npm are available, preferring a
# user-space version manager for development. It never replaces a system
# Node installation.
#
# Precedence: built-in defaults < this file < environment < command line.

# Set to false to skip the Node component entirely.
INSTALL_NODE_TOOLS=true

# Optional: pin a specific Node version. Empty = use the system default.
NODE_VERSION=""
