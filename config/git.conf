# config/git.conf — Git component configuration.
#
# The git component installs git when missing and configures user settings
# from the values below. Only settings with a non-empty value are applied;
# existing user configuration is never overwritten.
#
# Precedence: built-in defaults < this file < environment < command line.

# Set to false to skip the git component entirely.
INSTALL_GIT=true

# user.name — leave empty to skip this setting.
GIT_USER_NAME=""

# user.email — leave empty to skip this setting.
GIT_USER_EMAIL=""

# init.defaultBranch — default branch name for new repositories.
GIT_DEFAULT_BRANCH="main"

# core.editor — leave empty to keep the system default.
GIT_EDITOR=""

# pull.rebase — true to rebase on pull, false to merge.
GIT_PULL_REBASE=true

# color.ui — true to enable coloured git output.
GIT_COLOR_UI=true
