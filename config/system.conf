# config/system.conf — system-level behaviour.
#
# Precedence: built-in defaults < this file < environment < command line.

# Refresh package metadata and run a full system upgrade.
# false = refresh metadata only (where the package manager allows it;
# pacman cannot refresh without upgrading — see lib/pkg.sh).
UPDATE_SYSTEM=true

# Baseline development packages — logical names (see README "Components"),
# resolved per distribution through packages/<family>.sh (e.g. fd becomes
# fd-find on Fedora/Debian, ssh-client becomes openssh-clients on RHEL).
# Space separated; set to "" to skip baseline installation entirely.
BASELINE_PACKAGES="git curl wget ca-certificates unzip zip tar gzip xz ssh-client build-essential make cc jq tree tmux htop ripgrep fd findutils vim"
